name: Ramtastic Zoo diagnostic audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    name: Diagnostic source repair, axioms and semantic probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Apply explicit diagnostic namespace and zero-form correction
        run: python3 audit/diagnostic_namespace.py
      - name: Build diagnostically corrected source
        run: lake build
      - name: Audit all project declarations
        run: lake env lean -DwarningAsError=true audit/StrictAudit.lean
      - name: Exercise audit rejection controls
        run: python3 audit/test_axiom_audit.py
      - name: Verify semantic counterexamples
        run: lake env lean -DwarningAsError=true audit/SemanticProbes.lean
      - name: Verify dependency pins
        run: git diff --exit-code -- lean-toolchain lakefile.lean lake-manifest.json
